[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
format-padding = 1
ws-icon-0 = 1;1
ws-icon-1 = 2;2
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = 5;5
ws-icon-5 = 6;6
ws-icon-6 = 7;7
ws-icon-7 = 8;8
ws-icon-8 = 9;9
ws-icon-9 = 10;10
ws-icon-default = ?
format = <label-state> <label-mode>
label-focused = %icon%
label-focused-foreground = ${colors.faded_red}
label-focused-background = ${colors.dark0_hard}
label-focused-padding = 1
label-unfocused = %icon%
label-unfocused-foreground = ${colors.light0_soft}
label-unfocused-background = ${colors.dark0_hard}
label-unfocused-padding = 1
label-visible = %icon%
label-visible-padding = 1
label-urgent = %icon%
label-urgent-foreground = ${colors.dark0_hard}
label-urgent-background = ${colors.bright_red}
label-urgent-padding = 1
label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.bright_aqua}

[module/cpu]
type = internal/cpu
interval = 2
format = CPU <label>
format-foreground = ${colors.light0_soft}
format-padding = 1
label = %percentage%%
bar-load-width = 16
bar-load-indicator =
bar-load-fill = ·
bar-load-fill-foreground = ${colors.faded_yellow}
bar-load-empty = ·
bar-load-empty-foreground = ${colors.dark0_soft}

[module/memory]
type = internal/memory
interval = 3
format = MEM <label> <bar-used>
format-foreground = ${colors.light0_soft}
format-padding = 1
label = %gb_used%
bar-used-width = 16
bar-used-indicator =
bar-used-fill = ·
bar-used-fill-foreground = ${colors.faded_yellow}
bar-used-empty = ·
bar-used-empty-foreground = ${colors.dark0_soft}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume> <bar-volume>
format-volume-background = ${colors.dark0_hard}
format-volume-foreground = ${colors.light0_soft}
format-volume-padding = 1
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
format-muted =  muted
format-muted-background = ${colors.dark0_hard}
format-muted-foreground = ${colors.faded_red}
format-muted-padding = 1
bar-volume-width = 12
bar-volume-fill = ·
bar-volume-fill-foreground = ${colors.faded_yellow}
bar-volume-empty = ·
bar-volume-empty-foreground = ${colors.dark0_soft}
click-right = pavucontrol &

[module/backlight]
type = internal/backlight
card = intel_backlight
format = BRI %percentage%%
format-foreground = ${colors.light0_soft}
format-padding = 1

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 30
format-charging = BAT %percentage%%+
format-discharging = BAT %percentage%%
format-full = BAT full
format-charging-foreground = ${colors.light0_soft}
format-discharging-foreground = ${colors.light0_soft}
format-full-foreground = ${colors.light0_soft}
format-padding = 1

[module/date]
type = internal/date
interval = 10
time = %a %d %b %H:%M
time-alt = %Y-%m-%d %H:%M:%S
format = <label>
format-background = ${colors.dark0_hard}
format-foreground = ${colors.light0_soft}
format-padding = 1
label = %time%

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 1800
format-foreground = ${colors.faded_yellow}
format-padding = 1
click-left = alacritty -e ~/arch-i3-minimal/update.sh &

[module/weather]
type = custom/script
exec = ~/.config/polybar/scripts/weather.sh
interval = 900
format-foreground = ${colors.faded_aqua}
format-padding = 1
click-left = firefox 'https://wttr.in' &

[module/volume]
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
format-volume-background = ${colors.dark0_hard}
format-volume-foreground = ${colors.light0_soft}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
label-volume = %percentage%%
format-muted =  muted
format-muted-foreground = ${colors.faded_red}
bar-volume-width = 10
bar-volume-fill = ━
bar-volume-fill-foreground = ${colors.faded_yellow}
bar-volume-empty = ━
bar-volume-empty-foreground = ${colors.dark0_soft}
