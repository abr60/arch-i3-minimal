[module/healthbar]
type = custom/script
exec = ~/.config/polybar/scripts/healthbar.sh
tail = true
interval = 30
format-background = ${colors.dark0_hard}
format-foreground = ${colors.light0_soft}
format-padding = 1

[module/wifibar]
type = custom/script
exec = ~/.config/polybar/scripts/wifibar.sh
tail = true
interval = 5
format-background = ${colors.dark0_hard}
format-foreground = ${colors.light0_soft}
format-padding = 1

[module/netspeed]
type = custom/script
exec = ~/.config/polybar/scripts/netspeed.sh
tail = true
interval = 2
format-background = ${colors.dark0_hard}
format-foreground = ${colors.light0_soft}
format-padding = 1

[module/bluetooth_speaker]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth_speaker.sh
tail = true
interval = 10
format-background = ${colors.dark0_hard}
format-foreground = ${colors.light0_soft}
format-padding = 1
click-left = ~/.config/rofi/scripts/bluetooth.sh &

[module/net_indicator]
type = custom/script
exec = ~/.config/polybar/scripts/net_indicator.sh
tail = true
interval = 5
format-background = ${colors.dark0_hard}
format-foreground = ${colors.light0_soft}
format-padding = 1
click-left = alacritty -e nmtui &

[module/dunst_indicator]
type = custom/script
exec = ~/.config/polybar/scripts/dunst_indicator.sh
tail = true
interval = 2
format-background = ${colors.dark0_hard}
format-foreground = ${colors.light0_soft}
format-padding = 1
click-left = dunstctl set-paused toggle

[module/custom_time]
type = custom/script
exec = ~/.config/polybar/scripts/custom_time.sh
tail = true
interval = 1
format-background = ${colors.dark0_hard}
format-foreground = ${colors.light0_soft}
format-padding = 1

[module/redblock]
type = custom/text
content = " "
content-background = ${colors.faded_red}
content-padding = 1

[module/yellowblock]
type = custom/text
content = " "
content-background = ${colors.faded_yellow}
content-padding = 1

[module/greenblock]
type = custom/text
content = " "
content-background = ${colors.faded_green}
content-padding = 1

[module/blueblock]
type = custom/text
content = " "
content-background = ${colors.faded_blue}
content-padding = 1
