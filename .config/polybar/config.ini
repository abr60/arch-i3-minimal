[colors]
bg = #1a1a1a
bg-alt = #2a2a2a
fg = #d4d4d4
dim = #767676
accent = #808080
alert = #cc6666

[bar/main]
monitor-fallback = eDP-1
width = 100%
height = 26
offset-x = 0
offset-y = 0
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = JetBrainsMono Nerd Font:size=10;2
modules-left = i3
modules-center =
modules-right = updates weather cpu memory pulseaudio backlight battery date
separator =
dim-value = 1.0
tray-position = right
tray-padding = 6
tray-background = ${colors.bg}
wm-restack = i3
override-redirect = false
bottom = false

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
ws-icon-0 = 1;1
ws-icon-1 = 2;2
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = 5;5
label-focused = %name%
label-focused-background = ${colors.bg-alt}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-padding = 2
label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 2

[module/cpu]
type = internal/cpu
interval = 2
format = CPU %percentage%%
format-foreground = ${colors.dim}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 5
format = MEM %gb_used%
format-foreground = ${colors.dim}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = VOL %percentage%%
format-muted = VOL muted
format-muted-foreground = ${colors.alert}
label-volume-foreground = ${colors.dim}

[module/backlight]
type = internal/backlight
card = intel_backlight
format = BRI %percentage%%
format-foreground = ${colors.dim}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 30
format-charging = BAT %percentage%%+
format-discharging = BAT %percentage%%
format-full = BAT full
format-charging-foreground = ${colors.fg}
format-discharging-foreground = ${colors.dim}
format-full-foreground = ${colors.dim}

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 1800
format-foreground = ${colors.dim}
click-left = alacritty -e ~/arch-i3-minimal/update.sh &

[module/weather]
type = custom/script
exec = ~/.config/polybar/scripts/weather.sh
interval = 900
format-foreground = ${colors.dim}
click-left = firefox 'https://wttr.in' &

[module/date]
type = internal/date
interval = 10
date = %a %d %b %H:%M
label = %date%
label-foreground = ${colors.fg}

[settings]
screenchange-reload = true
