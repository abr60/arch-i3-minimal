[global/wm]
margin-top = 0
margin-bottom = 0

include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini
include-file = ~/.config/polybar/custom_modules.ini

[bar/main]
monitor-fallback = eDP-1
width = 100%
height = 32
offset-x = 0
offset-y = 0
background = ${colors.dark0_hard}
foreground = ${colors.light0_soft}
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 0
module-margin-right = 0
font-0 = RobotoMono Nerd Font:style=Medium:size=11;2
font-1 = feather:size=13;3
font-2 = RobotoMono Nerd Font:style=Medium:size=16;4
font-3 = Pragmata Pro Mono:size=11:style=Medium;3
modules-left = i3
modules-center = custom_time
modules-right = updates healthbar cpu memory pulseaudio backlight battery net_indicator dunst_indicator bluetooth_speaker weather date
separator =
dim-value = 1.0
tray-position = right
tray-padding = 6
tray-background = ${colors.dark0_hard}
wm-restack = i3
override-redirect = false
bottom = false
fixed-center = true
enable-ipc = true
tray-maxsize = 18

[settings]
screenchange-reload = true
throttle-output = 5
throttle-output-for = 10
throttle-input-for = 30
compositing-background = source
compositing-foreground = over
