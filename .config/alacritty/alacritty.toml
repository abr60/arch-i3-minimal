[general]
import = []
live_config_reload = true

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[window]
padding = { x = 14, y = 14 }
opacity = 1.0
decorations = "None"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11.0

[colors]
primary = { background = "#1a1a1a", foreground = "#d4d4d4" }
cursor = { text = "#1a1a1a", cursor = "#d4d4d4" }
selection = { text = "#1a1a1a", background = "#808080" }
normal = { black = "#1a1a1a", red = "#cc6666", green = "#a3be8c", yellow = "#e7c547", blue = "#7e9cd8", magenta = "#9a7ecc", cyan = "#7dd0c6", white = "#d4d4d4" }
bright = { black = "#525252", red = "#cc6666", green = "#a3be8c", yellow = "#e7c547", blue = "#7e9cd8", magenta = "#9a7ecc", cyan = "#7dd0c6", white = "#e8e8e8" }

[cursor]
style = "Beam"

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
]
